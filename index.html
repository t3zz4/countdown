<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manca poco amore🩷</title>


<style>

/* =========================
   IMPOSTAZIONI GENERALI
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}


body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:linear-gradient(
        -45deg,
        #d63384,
        #e84393,
        #ff7eb3,
        #ffb6c1,
        #fd79a8
    );

    background-size:400% 400%;

    animation:bg 12s ease infinite;

    color:#ffffff;

    overflow:hidden;

    padding:20px;
}


/* ANIMAZIONE SFONDO */

@keyframes bg{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }

}


/* =========================
   CONTENITORE
========================= */

.container{

    width:100%;

    max-width:700px;

    text-align:center;

    padding:45px 35px;

    border-radius:30px;

    background:rgba(255,255,255,0.2);

    backdrop-filter:blur(15px);

    -webkit-backdrop-filter:blur(15px);

    box-shadow:
        0 8px 32px 0 rgba(199,21,133,0.35);

    border:
        1px solid rgba(255,255,255,0.4);

}


/* =========================
   TITOLO
========================= */

h1{

    font-size:3em;

    line-height:1.15;

    margin-bottom:10px;

    text-shadow:
        0 4px 10px rgba(139,0,70,0.25);

    color:#fff;

    transition:all 0.5s ease;

}


/* =========================
   SOTTOTITOLO
========================= */

p{

    font-size:1.2em;

    opacity:0.95;

    margin-bottom:35px;

    font-weight:500;

    text-shadow:
        0 2px 5px rgba(0,0,0,0.1);

}


/* =========================
   COUNTDOWN
========================= */

#countdown{

    display:flex;

    gap:20px;

    flex-wrap:wrap;

    justify-content:center;

}


.box{

    width:120px;

    height:120px;

    background:rgba(255,255,255,0.25);

    border-radius:24px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;

    border:
        1px solid rgba(255,255,255,0.5);

    box-shadow:
        0 4px 15px rgba(199,21,133,0.15);

    animation:float 4s ease-in-out infinite;

}


/* Animazioni singole caselle */

.box:nth-child(2){
    animation-delay:0.5s;
}

.box:nth-child(3){
    animation-delay:1s;
}

.box:nth-child(4){
    animation-delay:1.5s;
}


/* Movimento delle caselle */

@keyframes float{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }

}


/* Effetto hover */

.box:hover{

    transform:
        scale(1.1)
        translateY(-5px);

    background:
        rgba(255,255,255,0.4);

    box-shadow:
        0 8px 25px
        rgba(255,105,180,0.6);

}


/* Numeri */

.number{

    font-size:3em;

    font-weight:800;

    text-shadow:
        0 2px 5px rgba(0,0,0,0.15);

}


/* Etichette */

.label{

    margin-top:5px;

    font-size:0.85em;

    text-transform:uppercase;

    letter-spacing:2px;

    font-weight:600;

}


/* =========================
   MESSAGGIO 5 MESI
========================= */

#loveMessage{

    display:none;

    font-size:2.2em;

    font-weight:700;

    line-height:1.3;

    text-shadow:
        0 4px 15px rgba(0,0,0,0.2);

    animation:
        appear 0.8s ease;

}


/* Animazione messaggio */

@keyframes appear{

    from{

        opacity:0;

        transform:
            scale(0.9);

    }

    to{

        opacity:1;

        transform:
            scale(1);

    }

}


/* =========================
   BOTTONE
========================= */

#loveButton{

    margin-top:30px;

    padding:14px 28px;

    border:none;

    border-radius:50px;

    background:
        rgba(255,255,255,0.3);

    color:white;

    font-size:1em;

    font-weight:700;

    cursor:pointer;

    border:
        1px solid rgba(255,255,255,0.6);

    backdrop-filter:blur(10px);

    box-shadow:
        0 5px 15px
        rgba(199,21,133,0.2);

    transition:
        transform 0.25s ease,
        background 0.25s ease,
        box-shadow 0.25s ease;

}


/* Bottone attivo */

#loveButton:hover:not(:disabled){

    transform:
        scale(1.07);

    background:
        rgba(255,255,255,0.45);

    box-shadow:
        0 8px 25px
        rgba(255,105,180,0.5);

}


/* Click */

#loveButton:active:not(:disabled){

    transform:
        scale(0.95);

}


/* Bottone disabilitato */

#loveButton:disabled{

    cursor:not-allowed;

    opacity:0.75;

    background:
        rgba(255,255,255,0.18);

    box-shadow:
        0 4px 12px
        rgba(199,21,133,0.12);

}


/* =========================
   FINE COUNTDOWN
========================= */

#finished{

    font-size:2.5em;

    font-weight:bold;

    display:none;

    text-shadow:
        0 4px 15px rgba(0,0,0,0.2);

}


/* =========================
   SMARTPHONE
========================= */

@media(max-width:700px){

    body{

        padding:15px;

    }


    .container{

        padding:32px 18px;

        border-radius:25px;

        max-width:100%;

    }


    h1{

        font-size:2em;

        line-height:1.2;

    }


    p{

        font-size:1em;

        margin-bottom:25px;

    }


    #countdown{

        gap:10px;

    }


    .box{

        width:
            calc(50% - 5px);

        height:95px;

        border-radius:18px;

    }


    .number{

        font-size:2em;

    }


    .label{

        font-size:0.7em;

        letter-spacing:1.5px;

    }


    #loveButton{

        width:90%;

        margin-top:25px;

        padding:13px 18px;

        font-size:0.95em;

    }


    #loveMessage{

        font-size:1.65em;

        line-height:1.35;

        padding:
            10px 5px;

    }


    #finished{

        font-size:1.8em;

    }

}


/* =========================
   TELEFONI MOLTO PICCOLI
========================= */

@media(max-width:380px){

    .container{

        padding:
            25px 14px;

    }


    h1{

        font-size:1.7em;

    }


    .box{

        height:85px;

    }


    .number{

        font-size:1.7em;

    }


    #loveMessage{

        font-size:1.45em;

    }

}

</style>

</head>


<body>


<div class="container">


    <!-- =====================
         TITOLO
    ====================== -->

    <h1 id="title">

        ✨ Manca poco amore🩷 ✨

    </h1>


    <!-- =====================
         SOTTOTITOLO
    ====================== -->

    <p id="subtitle">

        Mancano al 15 Agosto 2026 🥳

    </p>


    <!-- =====================
         COUNTDOWN
    ====================== -->

    <div id="countdown">


        <!-- GIORNI -->

        <div class="box">

            <div
                class="number"
                id="days"
            >

                00

            </div>

            <div class="label">

                Giorni

            </div>

        </div>


        <!-- ORE -->

        <div class="box">

            <div
                class="number"
                id="hours"
            >

                00

            </div>

            <div class="label">

                Ore

            </div>

        </div>


        <!-- MINUTI -->

        <div class="box">

            <div
                class="number"
                id="minutes"
            >

                00

            </div>

            <div class="label">

                Minuti

            </div>

        </div>


        <!-- SECONDI -->

        <div class="box">

            <div
                class="number"
                id="seconds"
            >

                00

            </div>

            <div class="label">

                Secondi

            </div>

        </div>


    </div>


    <!-- =====================
         MESSAGGIO DEI 5 MESI
    ====================== -->

    <div id="loveMessage">

        BUON COMPLEANNO❤️<br>
         AMORE MIO ❤️

    </div>


    <!-- =====================
         BOTTONE
    ====================== -->

    <button
        id="loveButton"
        onclick="showLoveMessage()"
        disabled
    >

        Lavori in corso..🎂

    </button>


    <!-- =====================
         FINE COUNTDOWN
    ====================== -->

    <div id="finished">

        🎉 È arrivato il 15 Agosto 2026! 💖

    </div>


</div>



<script>


/* ==================================================
   DATA DEL 15 AGOSTO
================================================== */

const targetDate =

    new Date(
        "2026-08-15T00:00:00"
    ).getTime();



/* ==================================================
   FORMATTAZIONE NUMERI
================================================== */

function formatTime(time){

    return time < 10

        ? `0${time}`

        : time;

}



/* ==================================================
   AGGIORNAMENTO COUNTDOWN
================================================== */

function updateCountdown(){


    const now =

        new Date().getTime();


    const distance =

        targetDate - now;



    /* Se il countdown è terminato */

    if(distance <= 0){


        document.getElementById(
            "countdown"
        ).style.display = "none";


        document.getElementById(
            "finished"
        ).style.display = "block";


        return;

    }



    /* Giorni */

    const days =

        Math.floor(

            distance /
            (1000 * 60 * 60 * 24)

        );



    /* Ore */

    const hours =

        Math.floor(

            (
                distance %
                (1000 * 60 * 60 * 24)
            )
            /
            (1000 * 60 * 60)

        );



    /* Minuti */

    const minutes =

        Math.floor(

            (
                distance %
                (1000 * 60 * 60)
            )
            /
            (1000 * 60)

        );



    /* Secondi */

    const seconds =

        Math.floor(

            (
                distance %
                (1000 * 60)
            )
            /
            1000

        );



    /* Scrive i valori */

    document.getElementById(
        "days"
    ).innerHTML =

        formatTime(days);


    document.getElementById(
        "hours"
    ).innerHTML =

        formatTime(hours);


    document.getElementById(
        "minutes"
    ).innerHTML =

        formatTime(minutes);


    document.getElementById(
        "seconds"
    ).innerHTML =

        formatTime(seconds);

}



/* Avvia countdown */

updateCountdown();


setInterval(
    updateCountdown,
    1000
);



/* ==================================================
   CONTROLLO DEL 5 AGOSTO
================================================== */

function checkButtonDate(){


    const now =

        new Date();



    /*
       INIZIO DEL 5 AGOSTO

       05/08/2026
       ore 00:00:00
    */

    const startDate =

        new Date(
            "2026-08-14T00:00:00"
        );



    /*
       FINE DEL 5 AGOSTO

       06/08/2026
       ore 00:00:00

       Quindi il 5 agosto
       è completamente incluso.
    */

    const endDate =

        new Date(
            "2026-08-20T00:00:00"
        );



    const button =

        document.getElementById(
            "loveButton"
        );



    /*
       SE SIAMO NEL 5 AGOSTO
    */

    if(
        now >= startDate &&
        now < endDate
    ){


        button.disabled = false;


        button.innerHTML =

            "💌 Premi qui amore 💌";


    }


    /*
       PRIMA O DOPO IL 5 AGOSTO
    */

    else{


        button.disabled = true;


        button.innerHTML =

            "Lavori in corso..🎂";

    }

}



/* Controllo iniziale */

checkButtonDate();



/*
   Controlla ogni secondo.

   In questo modo se la pagina
   rimane aperta allo scoccare
   della mezzanotte, il bottone
   cambia automaticamente.
*/

setInterval(
    checkButtonDate,
    1000
);



/* ==================================================
   MOSTRA MESSAGGIO 5 MESI
================================================== */

function showLoveMessage(){


    const title =

        document.getElementById(
            "title"
        );


    const subtitle =

        document.getElementById(
            "subtitle"
        );


    const countdown =

        document.getElementById(
            "countdown"
        );


    const message =

        document.getElementById(
            "loveMessage"
        );


    const button =

        document.getElementById(
            "loveButton"
        );



    /*
       CONTROLLO DI SICUREZZA

       Se qualcuno prova a richiamare
       la funzione fuori dal 5 agosto,
       non succede niente.
    */

    const now =

        new Date();


    const startDate =

        new Date(
            "2026-08-05T00:00:00"
        );


    const endDate =

        new Date(
            "2026-08-06T00:00:00"
        );



    if(
        now < startDate ||
        now >= endDate
    ){


        button.disabled = true;


        button.innerHTML =

            "Lavori in corso..🎂";


        return;

    }



    /* ==================================================
       NASCONDE IL CONTENUTO ORIGINALE
    ================================================== */


    title.style.display = "none";


    subtitle.style.display = "none";


    countdown.style.display = "none";



    /* ==================================================
       MOSTRA IL MESSAGGIO
    ================================================== */

    message.style.display = "block";



    /* Cambia scritta bottone */

    button.innerHTML =

        "🩷 Ti amo 🩷";



    /*
       DOPO 30 SECONDI
       TORNA TUTTO COME PRIMA
    */

    setTimeout(function(){


        message.style.display =
            "none";


        title.style.display =
            "block";


        subtitle.style.display =
            "block";


        countdown.style.display =
            "flex";



        /*
           Controlliamo nuovamente
           che sia ancora il 5 agosto.
        */

        const currentTime =
            new Date();



        if(
            currentTime >= startDate &&
            currentTime < endDate
        ){


            button.disabled =
                false;


            button.innerHTML =
                "💌 Premi qui amore 💌";


        }


        else{


            button.disabled =
                true;


            button.innerHTML =
                "Lavori in corso🎂..";

        }


    }, 30000);

}


</script>


</body>

</html>
