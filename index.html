<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scusami cicci 🥺❤️</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            background:
                radial-gradient(circle at 20% 20%, rgba(255,255,255,0.7), transparent 25%),
                radial-gradient(circle at 80% 80%, rgba(255,180,205,0.5), transparent 30%),
                linear-gradient(135deg, #ffd6e5, #fff0f5, #ffc6dc);

            position: relative;
        }

        /* =========================
           CUORICINI SULLO SFONDO
        ========================= */

        .heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.65);
            font-size: 25px;
            animation: float 8s linear infinite;
            user-select: none;
            pointer-events: none;
        }

        .heart:nth-child(1) {
            left: 10%;
            bottom: -50px;
            animation-delay: 0s;
        }

        .heart:nth-child(2) {
            left: 25%;
            bottom: -50px;
            animation-delay: 2s;
            font-size: 18px;
        }

        .heart:nth-child(3) {
            left: 45%;
            bottom: -50px;
            animation-delay: 4s;
            font-size: 30px;
        }

        .heart:nth-child(4) {
            left: 65%;
            bottom: -50px;
            animation-delay: 1s;
            font-size: 20px;
        }

        .heart:nth-child(5) {
            left: 85%;
            bottom: -50px;
            animation-delay: 3s;
            font-size: 28px;
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            100% {
                transform: translateY(-115vh) rotate(25deg);
                opacity: 0;
            }
        }

        /* =========================
           CONTENITORE
        ========================= */

        .container {
            width: min(90%, 650px);
            padding: 45px 35px;

            text-align: center;

            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, 0.8);

            border-radius: 35px;

            box-shadow:
                0 20px 60px rgba(190, 80, 120, 0.2),
                inset 0 1px 0 rgba(255,255,255,0.8);

            animation: appear 0.8s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* =========================
           TESTO
        ========================= */

        h1 {
            color: #a93663;

            font-size: clamp(2rem, 7vw, 3.5rem);
            line-height: 1.15;

            font-weight: 800;

            text-shadow:
                0 3px 10px rgba(169, 54, 99, 0.15);

            margin-bottom: 25px;
        }

        .question {
            font-size: clamp(1.3rem, 4vw, 1.8rem);
            color: #713047;

            font-weight: 600;

            margin-bottom: 35px;
        }

        /* =========================
           BOTTONI
        ========================= */

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;

            min-height: 60px;

            position: relative;
        }

        button {
            border: none;
            border-radius: 999px;

            padding: 14px 35px;

            font-size: 1.1rem;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        #yes {
            background: linear-gradient(135deg, #ff4f87, #e8326d);
            color: white;

            box-shadow:
                0 8px 20px rgba(232, 50, 109, 0.3);
        }

        #yes:hover {
            transform: scale(1.08);
            box-shadow:
                0 12px 28px rgba(232, 50, 109, 0.4);
        }

        #yes:active {
            transform: scale(0.95);
        }

        #no {
            background: white;
            color: #a93663;

            box-shadow:
                0 6px 18px rgba(100, 40, 70, 0.15);

            position: relative;
        }

        #no:hover {
            transform: scale(1.05);
        }

        /* =========================
           SCHERMATA FINALE
        ========================= */

        .final-message {
            display: none;

            animation: finalAppear 1s ease;
        }

        .final-message h2 {
            color: #a93663;

            font-size: clamp(2rem, 7vw, 3.5rem);
            line-height: 1.2;

            font-weight: 800;

            text-shadow:
                0 4px 15px rgba(169, 54, 99, 0.15);
        }

        @keyframes finalAppear {
            from {
                opacity: 0;
                transform: scale(0.7);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            .container {
                padding: 35px 22px;
                border-radius: 28px;
            }

            h1 {
                font-size: 2.1rem;
            }

            .question {
                font-size: 1.35rem;
            }

            .buttons {
                gap: 15px;
            }

            button {
                padding: 13px 28px;
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>

    <!-- Cuoricini -->
    <div class="heart">❤️</div>
    <div class="heart">♡</div>
    <div class="heart">💗</div>
    <div class="heart">💕</div>
    <div class="heart">❤️</div>


    <div class="container" id="container">

        <!-- SCHERMATA INIZIALE -->
        <div id="initialScreen">

            <h1>
                scusami se sono stato scontroso cicci 😔🥺
            </h1>

            <div class="question">
                mi perdoni?
            </div>

            <div class="buttons">

                <button id="yes">
                    Sì ❤️
                </button>

                <button id="no">
                    No 😤
                </button>

            </div>

        </div>


        <!-- SCHERMATA FINALE -->
        <div class="final-message" id="finalScreen">

            <h2>
                YEEE grazie cicci ❤️🥹<br><br>
                ti amo ❤️<br><br>
                vedrai che il tuo compleanno andrà benissimo cicci,
                non ti preoccupare 🥹❤️
            </h2>

        </div>

    </div>


    <script>

        const yesButton = document.getElementById("yes");
        const noButton = document.getElementById("no");

        const initialScreen = document.getElementById("initialScreen");
        const finalScreen = document.getElementById("finalScreen");

        /*
         * ============================
         * BOTTONE "SI"
         * ============================
         */

        yesButton.addEventListener("click", function () {

            initialScreen.style.display = "none";

            finalScreen.style.display = "block";

        });


        /*
         * ============================
         * BOTTONE "NO"
         * ============================
         *
         * Ogni volta che viene premuto,
         * si sposta in una posizione casuale.
         */

        noButton.addEventListener("click", function () {

            const buttonWidth = noButton.offsetWidth;
            const buttonHeight = noButton.offsetHeight;

            const maxX = window.innerWidth - buttonWidth - 20;
            const maxY = window.innerHeight - buttonHeight - 20;

            const randomX = Math.max(
                20,
                Math.floor(Math.random() * maxX)
            );

            const randomY = Math.max(
                20,
                Math.floor(Math.random() * maxY)
            );

            noButton.style.position = "fixed";

            noButton.style.left = randomX + "px";
            noButton.style.top = randomY + "px";

        });

    </script>

</body>
</html>
